apiVersion: meta.dev.upbound.io/v2alpha1
kind: Project
metadata:
  name: cloudflare-worker
spec:
  dependsOn:
  - apiVersion: pkg.crossplane.io/v1
    kind: Function
    package: xpkg.crossplane.io/crossplane-contrib/function-auto-ready
    version: '>=v0.6.4'
  description: Deploy Cloudflare Workers from OCI bundles with optional private connectivity.
  license: Apache-2.0
  maintainer: Hops maintainers
  readme: |
    # CloudflareWorker
    Deploy Workers from an OCI bundle with optional private origins and a private HTTP relay.
  repository: ghcr.io/hops-ops/cloudflare-worker
  source: github.com/hops-ops/cloudflare-worker
