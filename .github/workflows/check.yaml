name: CloudflareWorker checks
on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v6
    - uses: upbound/action-up@v1.0.0
      with:
        skip-login: true
    - run: make build
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v6
    - uses: upbound/action-up@v1.0.0
      with:
        skip-login: true
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - run: pip install PyYAML==6.0.3
    - run: make test
      env:
        CLOUDFLARE_WORKER_VALIDATE_RELAY: 'true'
