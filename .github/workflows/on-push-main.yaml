name: on-push-main
on:
  push:
    branches: [main]

permissions: {}

jobs:
  checks:
    permissions:
      contents: read
    uses: ./.github/workflows/check.yaml

  e2e-provider:
    needs: checks
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/cloudflare-e2e-provider.yaml

  e2e:
    needs: e2e-provider
    runs-on: ubuntu-24.04
    environment: cloudflare-e2e
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: ./.github/actions/cloudflare-e2e
      with:
        account-id: ${{ vars.CLOUDFLARE_TEST_ACCOUNT_ID }}
        subdomain: ${{ vars.CLOUDFLARE_TEST_WORKERS_SUBDOMAIN }}
        api-token: ${{ secrets.CLOUDFLARE_TEST_API_TOKEN }}
        family-provider: ${{ needs.e2e-provider.outputs.family }}
        workers-provider: ${{ needs.e2e-provider.outputs.workers }}

  version-and-tag:
    needs: [checks, e2e]
    permissions:
      contents: write
    uses: unbounded-tech/workflow-vnext-tag/.github/workflows/workflow.yaml@v1.21.3
    with:
      useDeployKey: true
    secrets:
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
