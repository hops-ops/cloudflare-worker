name: Cloudflare Workers test provider
on:
  workflow_call:
    outputs:
      workers:
        value: ${{ jobs.build-provider.outputs.workers }}
      family:
        value: ${{ jobs.build-provider.outputs.family }}

permissions:
  contents: read
  packages: write

jobs:
  build-provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Replace this public source candidate with a release once OCI bundles ship.
      PROVIDER_REVISION: 9830c6d4b061ec4822135dba1b28a64399684949
    outputs:
      workers: ${{ steps.package.outputs.workers }}
      family: ${{ steps.package.outputs.family }}
    steps:
    - uses: actions/checkout@v6
      with:
        repository: wildbitca/provider-upjet-cloudflare
        ref: ${{ env.PROVIDER_REVISION }}
        path: provider
        submodules: true
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: '1.26.8'
        cache-dependency-path: provider/go.sum
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
    - name: Publish the Workers and family test providers to Hops GHCR
      id: package
      working-directory: provider
      env:
        GHCR_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        registry="ghcr.io/${GITHUB_REPOSITORY,,}-e2e-provider"
        version="v1.0.4-preview.$PROVIDER_REVISION"
        printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        for package in workers family; do
          repository="$registry"
          group=workers
          name=provider-cloudflare-workers
          if [[ "$package" == family ]]; then
            repository="$registry-family"
            group=config
            name=provider-family-cloudflare
          fi
          target="$repository:$version"
          if ! digest="$(docker buildx imagetools inspect "$target" --format '{{ .Manifest.Digest }}' 2>/dev/null)"; then
            if [[ ! -x "$RUNNER_TEMP/crossplane" ]]; then
              curl --fail --silent --show-error --location --retry 3 \
                https://releases.crossplane.io/stable/v2.1.3/bin/linux_amd64/crank -o "$RUNNER_TEMP/crossplane"
              chmod +x "$RUNNER_TEMP/crossplane"
              make vendor vendor.check
            fi
            make build.family FAMILY_SUBPACKAGES="$group" SUBPACKAGES="$group" PLATFORM=linux_amd64 \
              VERSION="$version" CROSSPLANE_CLI="$RUNNER_TEMP/crossplane"
            "$RUNNER_TEMP/crossplane" xpkg push \
              -f "_output/xpkg/linux_amd64/$name-$version.xpkg" "$target"
            digest="$(docker buildx imagetools inspect "$target" --format '{{ .Manifest.Digest }}')"
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s=%s@%s\n' "$package" "$repository" "$digest" >> "$GITHUB_OUTPUT"
        done
